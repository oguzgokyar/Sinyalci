[project]
name = "usb-trader"
version = "0.1.0"
description = "Zero-ADB USB AOA 2.0 HID MetaTrader Mobile Automation Engine"
requires-python = ">=3.11"
dependencies = [
    "pyusb>=1.2.1",
    "libusb-package>=1.0.26.2",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.3.24",
]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usb_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
